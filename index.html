<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rastriya Banijya Bank</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: white;
  display: grid;
  place-items: center;
  height: 100vh;
  margin: 0;
}
.card {
  width: 90%;
  max-width: 400px;
  padding: 30px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  margin: 20px;
}
.logo {
  text-align: center;
  margin-bottom: 25px;
}
.logo img {
  max-width: 100%;
  width: 320px;
  height: auto;
}
h3 {
  text-align: center;
  color: #333;
  margin-bottom: 25px;
  font-size: 24px;
}
input, button {
  width: 100%;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 16px;
  box-sizing: border-box;
}
input:focus {
  outline: none;
  border-color: #F69931;
  box-shadow: 0 0 0 3px rgba(246, 153, 49, 0.1);
}
button {
  background: linear-gradient(135deg, #DC0019 0%, #B80015 100%);
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(220, 0, 25, 0.3);
}
.notice {
  font-size: 12px;
  color: #666;
  text-align: center;
  margin-top: 15px;
}
#formMessage {
  display: none;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  font-size: 14px;
  margin-bottom: 15px;
}
#formMessage.success {
  display: block;
  background: #e8f5e9;
  color: #2e7d32;
  border: 1px solid #a5d6a7;
}
#formMessage.error {
  display: block;
  background: #ffebee;
  color: #c62828;
  border: 1px solid #ef9a9a;
}
button:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}
</style>
</head>
